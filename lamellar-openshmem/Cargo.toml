[package]
name = "lamellar-openshmem"
version = "0.1.0"
edition = "2021"
description = "OpenSHMEM 1.4 C API implemented on top of the Lamellar runtime"
license-file = "../lamellar-runtime/LICENSE"

build = "build.rs"

[lib]
name = "shmem"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lamellar = { path = "../lamellar-runtime", default-features = false, features = [] }
paste = "1.0"
libc = "0.2"
parking_lot = "0.12"
# Only present to switch on lamellar-libfabric's `shared` feature (feature unification applies it
# to the copy lamellar uses), so libfabric builds as libfabric.so instead of static objects.
ofi-shared = { package = "lamellar-libfabric", version = "0.1.0", features = ["shared"], optional = true }
# The optimized libfabric lamellae use lamellar-libfabric-sys directly (not lamellar-libfabric), so the shared build has
# to switch on that crate's own `shared` feature.
ofi-sys-shared = { package = "lamellar-libfabric-sys", version = "0.1.0", features = ["shared"], optional = true }
# Likewise for lamellar-ucx-sys: UCX as libucp.so/libuct.so/libucs.so/libucm.so instead of static archives.
ucx-sys-shared = { package = "lamellar-ucx-sys", version = "0.1.1", features = ["shared"], optional = true }

[features]
default = []
# Required by `cargo cinstall` (cargo-c); gates nothing.
capi = []
# Backend selection is additive and forwarded to lamellar; pick at build time,
# then choose at run time with SHMEM_BACKEND / LAMELLAR_BACKEND.
libfabric = ["lamellar/enable-libfabric", "lamellar/with-pmix", "lamellar/vendored-pmi"]
# libfabric as libfabric.so: required to build the libshmem.so cdylib (the static vendored objects
# carry versioned symbols that cannot be linked into a shared library).
libfabric-shared = ["libfabric", "dep:ofi-shared"]
ucx = ["lamellar/enable-ucx", "lamellar/with-pmix", "lamellar/vendored-pmi"]
# UCX as shared libraries: the libucp.so family can then be shared with other UCX clients in the same process tree
# (for example to run Open MPI's OSHMEM on the very same UCX build) and copied next to libshmem.so.
ucx-shared = ["ucx", "dep:ucx-sys-shared"]
# The runtime's optimized UCX lamellae (ticketed completion, per-endpoint epoch flush, worker sharding). Select it at
# run time with LAMELLAR_BACKEND=ucx-opt. Can be combined with ucx-shared.
ucx-opt = ["lamellar/enable-ucx-opt", "lamellar/with-pmix", "lamellar/vendored-pmi"]
# The runtime's optimized shared-memory lamellae (single node). Select it at run time with LAMELLAR_BACKEND=shmem-opt;
# the shim turns on the runtime's external-memory registration for it (globals as remote targets).
# with-pmix/vendored-pmi give the single-node lamellae a PMIx client, so under prterun they get their rank, size and job id
# from it (without it every process would be PE 0); oshrun/srun launches still work through LAMELLAR_PE_ID/NUM_PES/JOB_ID.
shmem-opt = ["lamellar/enable-shmem-opt", "lamellar/with-pmix", "lamellar/vendored-pmi"]
# The runtime's optimized libfabric lamellae (raw libfabric-sys calls). Select it at run time with
# LAMELLAR_BACKEND=libfabric-sys-opt. The -shared form builds libfabric as libfabric.so, which the libshmem.so cdylib needs.
libfabric-sys-opt = ["lamellar/enable-libfabric-sys-opt", "lamellar/with-pmix", "lamellar/vendored-pmi"]
libfabric-sys-opt-shared = ["libfabric-sys-opt", "dep:ofi-sys-shared"]
rofi = ["lamellar/enable-rofi-c"]

[profile.release]
lto = true
codegen-units = 1

# Resolve lamellar's sibling crates from this monorepo (same crates the
# lamellar-runtime "Variant B" patch block uses, paths relative to this crate).
[patch.crates-io]
pmi = { path = "../process_management/pmi" }
pmi-sys = { path = "../process_management/pmi-sys" }
pmi2-sys = { path = "../process_management/pmi2-sys" }
pmi-mpich-src = { path = "../process_management/pmi-mpich-src" }
pmix-sys = { path = "../process_management/pmix-sys" }
openpmix-src = { path = "../process_management/openpmix-src" }
rofisys = { path = "../communication_frameworks/rofi-sys" }
lamellar-libfabric = { path = "../communication_frameworks/libfabric" }
lamellar-libfabric-sys = { path = "../communication_frameworks/libfabric-sys" }
lamellar-libfabric-src = { path = "../communication_frameworks/libfabric-src" }
lamellar-ucx-sys = { path = "../communication_frameworks/lamellar-ucx-sys" }
lamellar-ucc-sys = { path = "../communication_frameworks/lamellar-ucc-sys" }

# `cargo cinstall --prefix <prefix>` (cargo-c) installs libshmem.so (+ soname links), libshmem.a, shmem.h and shmem.pc.
# The header is generated by include/gen_shmem_h.py (not cbindgen) and checked in; cargo-c installs it from assets/.
[package.metadata.capi.header]
generation = false
subdirectory = ""

[package.metadata.capi.library]
name = "shmem"

[package.metadata.capi.pkg_config]
name = "shmem"
description = "OpenSHMEM 1.4 on the Lamellar runtime"

# find_package(LamellarShmem) -> <prefix>/share/cmake/LamellarShmem/LamellarShmemConfig.cmake
[package.metadata.capi.install.data]
subdirectory = ""
asset = [{ from = "cmake/LamellarShmemConfig.cmake", to = "cmake/LamellarShmem" }]

[workspace]
