[package]
name = "lamellar-libfabric-src"
version = "0.1.0-rc.1"
edition = "2024"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Vendored build of libfabric, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "network", "libfabric"]
categories = ["external-ffi-bindings", "network-programming"]

[lib]
name = "libfabric_src"

[dependencies]
autotools = "0.2.7"
cc = "1.2"
regex = "1.1"

[features]
shared = []
