[package]
name = "lamellar-ucx-sys"
authors = ["Ryan Friese <ryan.friese@pnnl.gov>"]
version = "0.1.1"
edition = "2024"
description = "This system crate provides Rust language bindings (via the use of Bindgen) to the UCXlibrary."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "network", "ditributed", "libfabrics"]
categories = ["external-ffi-bindings", "network-programming"]
links = "ucx"

[features]
# Build the vendored UCX as shared libraries (libucp.so, libuct.so, libucs.so, libucm.so plus the lib/ucx transport
# plugins) instead of linking static archives into the final binary. Needed to build a libshmem.so cdylib
# without duplicating UCX's process-global state, and to run another UCX client (for example Open MPI's OSHMEM)
# against the very same UCX build.
shared = []

[build-dependencies]
autotools = "0.2.7"
bindgen = "0.72.1"
glob = "0.3.3"

[lib]
name = "lamellar_ucx_sys"
