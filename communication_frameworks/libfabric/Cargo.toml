[package]
name = "lamellar-libfabric"
version = "0.1.0-rc.1"
edition = "2021"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Mid-level Rust bindings for libfabric, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "network", "libfabric"]
categories = ["external-ffi-bindings", "network-programming"]

[lib]
name = "libfabric"

[dependencies]
libfabric-sys = { package = "lamellar-libfabric-sys", version = "0.1.0-rc.1" }
tokio = { version = "1.38", optional = true, features = [
    "net",
    "rt",
    "macros",
] }
async-std = { version = "1.12.0", optional = true }
async-io = { version = "2.3.2", optional = true }
parking_lot = { version = "0.12.5", optional = true }
[features]
async-cqs-spin = []
use-async-std = ["async-std", "async-io", "async-cqs-spin"]
use-tokio = ["tokio", "async-cqs-spin"]
threading-completion = ["thread-safe"]
threading-domain = ["thread-safe"]
threading-endpoint = ["thread-safe", "threading-fid"]
threading-fid = ["thread-safe"]
threading-thread-safe = ["thread-safe"]
thread-safe = ["parking_lot"]                               # Not to be set by the user
shared = ["libfabric-sys/shared"]
