[package]
name = "lamellar-libfabric-sys"
version = "0.1.0-rc.1"
edition = "2021"
links = "ofi"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Low-level FFI bindings for libfabric, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "network", "libfabric"]
categories = ["external-ffi-bindings", "network-programming"]

[lib]
name = "libfabric_sys"

[dependencies]

[build-dependencies]
bindgen = "0.72.1"
libfabric-src = { package = "lamellar-libfabric-src", version = "0.1.0-rc.1" }

[features]
shared = ["libfabric-src/shared"]
