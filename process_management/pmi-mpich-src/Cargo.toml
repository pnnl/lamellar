[package]
name = "pmi-mpich-src"
version = "0.1.0-rc.3"
edition = "2024"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Vendored build of MPICH's PMI implementation, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar-runtime"
license-file = "LICENSE"
keywords = ["hpc", "pmi", "process-management"]
categories = ["external-ffi-bindings", "network-programming"]
exclude = [
    "mpich/modules/libfabric",
    "mpich/modules/hwloc",
    "mpich/modules/ucx",
    "mpich/modules/json-c",
    "mpich/modules/mydef_boot",
    "mpich/doc",
    "mpich/examples",
]

[dependencies]
autotools = "0.2.7"