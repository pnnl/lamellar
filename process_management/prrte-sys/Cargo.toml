[package]
name = "prrte-sys"
version = "0.1.1"
edition = "2021"
links = "prrte"
build = "build.rs"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Low-level FFI bindings to PRRTE, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "pmi", "process-management"]
categories = ["external-ffi-bindings", "network-programming"]

[features]
# hwloc is no longer a standalone knob here: openpmix-src vendor-builds it and
# pmix-sys re-exports the prefix via DEP_PMIX_HWLOC_ROOT/DEP_PMIX_HWLOC_INCLUDE
# (see prrte-src's Build::build()), so pulling in vendored-pmix is sufficient.
vendored = [
    "prrte-src",
    "vendored-libevent",
    "vendored-pmix",
]
vendored-libevent = ["libevent-sys/bundled", "pmix-sys?/vendored-libevent"]
vendored-pmix = ["pmix-sys/openpmix-src"]
# PRRTE's own ./configure hard-requires external PMIx headers (prte_setup_pmix.m4:
# "Cannot continue" if none found) -- there is no way to build PRRTE without PMIx.
# Redeclaring this optional-dep feature explicitly (instead of leaving it implicit)
# lets us pull in pmix-sys unconditionally, so enabling prrte-src can't skip it.
prrte-src = ["dep:prrte-src", "pmix-sys"]
vendored-prrte = [
    "prrte-src",
    "vendored-libevent",
    "pmix-sys",
]

[dependencies]
pmix-sys = { version = "0.1.0", optional = true }
libevent-sys = { version = "0.4.0", default-features = false, features = ["threading", "pkgconfig", "buildtime_bindgen"], optional = true }

[build-dependencies]
prrte-src = { version = "0.1.0", optional = true }
bindgen = "0.72.1"
