[package]
name = "hpc_launch"
version = "0.1.0"
edition = "2021"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Launcher support for self-launching multi-process binaries (#[hpc_launch::main]), usable standalone."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "runtime", "launcher", "distributed", "prterun"]
categories = ["asynchronous", "concurrency", "network-programming", "science"]

[dependencies]
hpc_launch_impl = { version = "0.1.0", path = "../hpc_launch_impl" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
] }
prrte-sys = { version = "0.1.0", optional = true }

[features]
default = ["use-prterun"]
use-srun = ["hpc_launch_impl/use-srun"]
use-prterun = [
    "hpc_launch_impl/use-prterun",
    "prrte-sys",
    "prrte-sys/prrte-src",
]
with-salloc = ["hpc_launch_impl/with-salloc"]
