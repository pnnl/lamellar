[package]
name = "pmix-sys"
version = "0.1.1"
edition = "2021"
links = "pmix"
build = "build.rs"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Low-level FFI bindings to PMIx, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "pmi", "process-management"]
categories = ["external-ffi-bindings", "network-programming"]


[features]
vendored = ["openpmix-src", "vendored-libevent"]
vendored-libevent = ["libevent-sys/bundled", "openpmix-src?/vendored-libevent"]

[dependencies]
libevent-sys = { version = "0.4.0", default-features = false, features = ["threading", "pkgconfig", "buildtime_bindgen"], optional = true }

[build-dependencies]
openpmix-src = { version = "0.1.0", optional = true }
bindgen = "0.72.1"
