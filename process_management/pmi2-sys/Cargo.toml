[package]
name = "pmi2-sys"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "pmi2"
authors = ["Ryan D. Friese <ryan.friese@pnnl.gov>"]
description = "Low-level FFI bindings to PMI2, developed for use by the Lamellar runtime."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "pmi", "process-management"]
categories = ["external-ffi-bindings", "network-programming"]

[features]
vendored = ["pmi-mpich-src"]

[dependencies]

[build-dependencies]
pmi-mpich-src = { version = "0.1.0", optional = true }
bindgen = "0.72.1"
