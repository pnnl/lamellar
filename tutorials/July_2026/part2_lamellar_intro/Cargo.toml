[package]
name = "lamellar_tutorial"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lamellar = { path = "../../../lamellar-runtime", features = ["runtime-warnings-panic"] }
rand = "0.9.0"

# You may need this if on macOS: hwloc's vendored autotools build fails there,
# so link a system hwloc instead by disabling default-features and setting
# HWLOC_DIR / PKG_CONFIG_PATH when building:
#   brew install hwloc libevent pkgconf
#   (also `brew reinstall autoconf automake libtool` if autoreconf fails with
#   "bad interpreter: /usr/bin/perl5.30: No such file or directory")
#   HWLOC_DIR=$(brew --prefix hwloc) PKG_CONFIG_PATH=$(brew --prefix hwloc)/lib/pkgconfig cargo build
# lamellar = { path = "../../../lamellar-runtime", default-features = false, features = ["runtime-warnings-panic", "with-pmix-vendored", "enable-lamellar-main", "enable-numa-detect"] }

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 256

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "main_array_basics"
path = "src/main_array_basics.rs"

[[bin]]
name = "main_am_deep_dive"
path = "src/main_am_deep_dive.rs"

[[bin]]
name = "main_array_types"
path = "src/main_array_types.rs"

[[bin]]
name = "main_capstone"
path = "src/main_capstone.rs"

[[bin]]
name = "solution_main"
path = "solutions/main.rs"

[[bin]]
name = "solution_main_array_basics"
path = "solutions/main_array_basics.rs"

[[bin]]
name = "solution_main_am_deep_dive"
path = "solutions/main_am_deep_dive.rs"

[[bin]]
name = "solution_main_array_types"
path = "solutions/main_array_types.rs"

[[bin]]
name = "solution_main_capstone"
path = "solutions/main_capstone.rs"
